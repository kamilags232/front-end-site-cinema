<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<link rel="stylesheet" href="gerencia.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div class="sidebar">

    <a class="logo" href="index.html" title="Voltar para a tela inicial do cinema">

        <i class="fa-solid fa-film"></i>

        <div>
            <h2>Cinemonroll</h2>
            <p>Painel administrativo</p>
        </div>

    </a>

    <nav>

        <a class="active" href="gerencia.html">
            <i class="fa-solid fa-chart-pie"></i>
            Dashboard
        </a>

        <a id="menuUsuarios" href="usuarios.html">
            <i class="fa-solid fa-users"></i>
            Usuários
        </a>

        <a id="menuProdutos" href="produtos.html">
            <i class="fa-solid fa-box-open"></i>
            Produtos
        </a>

        <a id="menuEstoque" href="estoque.html">
            <i class="fa-solid fa-box"></i>
            Estoque
        </a>

        <a id="menuVendas" href="vendas.html">
            <i class="fa-solid fa-ticket"></i>
            Vendas
        </a>

        <a id="menuRelatorios" href="relatorios.html">
            <i class="fa-solid fa-chart-line"></i>
            Relatórios
        </a>

        <a id="menuCinema" href="cinema.html">
            <i class="fa-solid fa-building"></i>
            Cinema
        </a>

    </nav>

</div>

<div class="main">

<header>

<div>

<h1>Painel Administrativo</h1>

<p>Gerencie todo o sistema do cinema.</p>

</div>

<div class="perfil">

<i class="fa-solid fa-user"></i>

<span id="nomeUsuario"></span>

</div>

</header>

<section class="cards">

<div class="card">

<i class="fa-solid fa-users"></i>

<div>

<h3>Funcionários</h3>

<h2 id="funcionarios">0</h2>

</div>

</div>

<div class="card">

<i class="fa-solid fa-film"></i>

<div>

<h3>Produtos</h3>

<h2 id="produtos">0</h2>

</div>

</div>

<div class="card">

<i class="fa-solid fa-box-open"></i>

<div>

<h3>Vendas Hoje</h3>

<h2 id="vendas">R$ 0</h2>

</div>

</div>

<div class="card">

<i class="fa-solid fa-box"></i>

<div>

<h3>Estoque Baixo</h3>

<h2 id="estoque">0</h2>

</div>

</div>

</section>

<section class="acoes">

<button id="novoUsuario">

<i class="fa-solid fa-user-plus"></i>

Novo Funcionário

</button>

<button id="abrirProdutos">

<i class="fa-solid fa-box-open"></i>

Produtos

</button>

<button id="abrirEstoque">

<i class="fa-solid fa-box"></i>

Estoque

</button>

<button id="abrirVendas">

<i class="fa-solid fa-cart-shopping"></i>

Consultar Vendas

</button>

<button id="abrirRelatorios">

<i class="fa-solid fa-chart-line"></i>

Relatórios

</button>

<button id="abrirCinema">

<i class="fa-solid fa-building"></i>

Dados do Cinema

</button>

</section>

<section class="usuarios">

<h2>Funcionários cadastrados</h2>

<table>

<thead>

<tr>

<th>Nome</th>

<th>Email</th>

<th>Cargo</th>

<th>Ações</th>

</tr>

</thead>

<tbody id="listaUsuarios">

</tbody>

</table>

</section>

</div>

<script src="gerencia.js"></script>

</body>

</html>
